<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="main.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <p>Library</p>
        <button class="open">Add a book</button>
    </header>
    <dialog>
        <form action="#">
            <h1>Add a new book</h1>
            <label for="title">Title</label>
            <input type="text" placeholder="Enter the title" id="title" name="title" required>
            <label for="author">Author</label>
            <input type="text" placeholder="Enter the author's name" id="author" name="author" required>
            <label for="pages">Pages</label>
            <input type="text" placeholder="Enter the number of pages" id="pages" name="pages" required>
            <label for="read">
                <input type="checkbox" id="read">
                <span>Have you read the book?</span>
            </label>
            <div>
                <button class="close">Add book</button>
                <button type="button" class="close">Close</button>
            </div>
        </form>
    </dialog>
    <main id="root"></main>
</body>
</html>
